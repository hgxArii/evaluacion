<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Torneos Gamer</title>
</head>
<body>
<div class="contenedor">

    <h1> Dashboard de Torneos Gamer</h1>
    <section>
        <label for="nombre">Nombre del torneo</label>
        <input type="text" id="nombre" placeholder="nombre del torneo">
        <span id="errorNombre" class="error"></span>

        <label for="categoria">Categoría</label>
        <select id="categoria">
            <option value="">Seleccione una categoría</option>
            <option value="Lucha">Lucha</option>
            <option value="Estrategia">Estrategia</option>
            <option value="Arcade">Arcade</option>
            <option value="Deportes">Deportes</option>
            <option value="Aventura">Aventura</option>
        </select>
        <span id="errorCategoria" class="error"></span>
        <label for="participantes">Participantes</label>
        <input type="number" id="participantes" placeholder="del 1 al 100">
        <span id="errorParticipantes" class="error"></span>
        <label for="valorInscripcion">Valor de inscripción</label>
        <input type="number" id="valorInscripcion" step="0.01" placeholder="valor Inscripcion">
        <span id="errorValor" class="error"></span>
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="email">
        <span id="errorEmail" class="error"></span>
        <button type="button" onclick="registrarTorneo()">
            REGISTRAR TORNEO
        </button>
        <p id="mensajeExito" class="exito"></p>
    </section>
    <h2>Torneos registrados</h2>
    <table>
        <thead>
        <tr>
         <th>Nombre</th>
         <th>Categoría</th>
         <th>Participantes</th>
         <th>Valor de inscripción</th>
         <th>Email</th>
         <th>Recaudación</th>
        </tr>
        </thead>
        <tbody id="cuerpoTabla">
        </tbody>
    </table>
</div>
<script src="dashboard.js"></script>
<script src="estilo.css"></script>
</body>
</html>
